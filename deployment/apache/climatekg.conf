<VirtualHost *:80>
    ServerName climatekg.example.org
    Redirect permanent / https://climatekg.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName climatekg.example.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/climatekg.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/climatekg.example.org/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8780/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8780/

    ErrorLog ${APACHE_LOG_DIR}/climatekg-error.log
    CustomLog ${APACHE_LOG_DIR}/climatekg-access.log combined

    <Location />
        Require all granted
    </Location>
</VirtualHost>
