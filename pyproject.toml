[project]
name = "land-atmosphere-kg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10", "pyarrow>=18", "numpy>=2", "faiss-cpu>=1.15,<2", "tiktoken>=0.9,<1", "earthengine-api>=1.7,<2", "Pillow>=12,<13", "rasterio>=1.4,<2"]

[project.optional-dependencies]
baselines = ["pandas>=3,<3.1", "graspologic-native>=1.2,<1.3"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climatekg*"]
exclude = ["climatekg.runtime*"]

[project.scripts]
climatekg = "climatekg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
