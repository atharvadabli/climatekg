[project]
name = "land-atmosphere-kg"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10", "pyarrow>=18", "numpy>=2", "faiss-cpu>=1.15,<2"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["climatekg*"]
exclude = ["climatekg.runtime*"]

[project.scripts]
climatekg = "climatekg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
